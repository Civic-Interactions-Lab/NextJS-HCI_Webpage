services:
  hci-web:
    image: ${HCI_WEB_IMAGE:?HCI_WEB_IMAGE must point to the published site image}
    pull_policy: always
    container_name: hci-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"

  hci-proxy:
    image: nginx:1.27-alpine
    container_name: hci-proxy
    restart: unless-stopped
    depends_on:
      - hci-web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
